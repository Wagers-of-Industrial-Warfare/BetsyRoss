# Adapted from Immersive Paintings mod.toml

modLoader = "javafml" #mandatory
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}" # Review your options at https://choosealicense.com/.
issueTrackerURL="${mod_issues}"

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
displayURL="${mod_sources}" #optional (displayed in the mod UI)
logoFile = "logo.png" #optional (needs to be in the root of your mod jar (root of your 'resources' folder))
credits = "${credits}" #optional
authors = "${mod_author}" #optional
description = '''${description}''' #mandatory (Supports multiline text)
displayTest="IGNORE_SERVER_VERSION"
itemIcon = "betsyross:flag_block"

[[mixins]]
config = "${mod_id}-common.mixins.json"

[[mixins]] # not strictly necessary
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "immersive_paintings"
type = "required"
versionRange = "[${immersive_paintings_neoforge_requirement},)"
ordering = "BEFORE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "fzzy_config"
type = "required"
versionRange = "[${fzzy_config_neoforge_requirement},)"
ordering = "BEFORE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
type = "optional"
versionRange = "[${curios_recommendation},)"
ordering = "BEFORE"
side = "BOTH"
